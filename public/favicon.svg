<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="roundelShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.22" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Circular Crisp White Base for Universal Contrast -->
  <circle cx="60" cy="60" r="52" fill="#FFFFFF" filter="url(#roundelShadow)" />
  
  <!-- Outer Transit Ring -->
  <circle cx="60" cy="60" r="39" fill="none" stroke="#0F766E" stroke-width="17" />
  
  <!-- Horizontal Transit Crossbar (Option B: Height 54px, Radius 10px) -->
  <rect x="2" y="33" width="116" height="54" rx="10" fill="#0284C7" filter="url(#roundelShadow)" />
  
  <!-- Inner Border Highlight on Crossbar -->
  <rect x="2" y="33" width="116" height="54" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45" />
  
  <!-- Bold High-Contrast Single Initial Letter (Option B: Font 53px, Weight 900) -->
  <text 
    x="60" 
    y="60" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Arial, sans-serif" 
    font-size="53" 
    font-weight="900" 
    letter-spacing="0px" 
    fill="#FFFFFF"
  >K</text>
</svg>
