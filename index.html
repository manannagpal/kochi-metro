  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <!-- High-Performance Script Loader: Defer Analytics & AdSense to Post-Load Idle / User Interaction -->
    <script>
      (function() {
        var thirdPartyLoaded = false;
        var interactionEvents = ['scroll', 'touchstart', 'click', 'keydown'];

        function loadThirdParty() {
          if (thirdPartyLoaded) return;
          thirdPartyLoaded = true;

          // Remove interaction listeners
          interactionEvents.forEach(function(evt) {
            window.removeEventListener(evt, loadThirdParty, { passive: true });
          });

          // 1. Google Analytics
          var gtm = document.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtag/js?id=G-75R3121JS1';
          document.head.appendChild(gtm);
          gtm.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-75R3121JS1');
          };

          // 2. Google AdSense
          var ads = document.createElement('script');
          ads.async = true;
          ads.crossOrigin = 'anonymous';
          ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3598421466906011';
          document.head.appendChild(ads);
        }

        // Attach intentional user interaction listeners (strictly excluding mousemove to prevent premature desktop firing)
        interactionEvents.forEach(function(evt) {
          window.addEventListener(evt, loadThirdParty, { passive: true, once: true });
        });

        // Always wait until window 'load' has completed before scheduling idle background loading
        function scheduleIdleLoad() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              setTimeout(loadThirdParty, 1200);
            }, { timeout: 3500 });
          } else {
            setTimeout(loadThirdParty, 2000);
          }
        }

        if (document.readyState === 'complete') {
          scheduleIdleLoad();
        } else {
          window.addEventListener('load', scheduleIdleLoad, { once: true });
        }
      })();
    </script>
  </body>
